[project]
name = "gentle1999-academic-homepage"
version = "0.1.0"
description = "A Quarto-based personal academic homepage with automated scholarly and GitHub metadata updates."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
